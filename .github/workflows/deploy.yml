name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Rebuild every 6 hours so newly published Sanity articles get static HTTP-200 HTML & sitemap.xml entries
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Project & Pre-render Static SEO Route Files
        run: |
          npm run build
          # Ensure CNAME is always present in artifact root
          echo "theglobaldoctrine.online" > dist/CNAME

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload dist folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
